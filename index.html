<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071A12">
  <meta name="description" content="صفحة متابعة طلبات التوصيل لشركة وصّل في صنعاء: استعرض الطلبات وابحث عنها ورتّبها بسهولة.">
  <title>وصّل | طلبات التوصيل</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <header class="site-header">
    <div class="header-art" aria-hidden="true"></div>
    <div class="container-xxl header-inner">
      <div class="d-flex justify-content-between align-items-center brand-row">
        <div class="brand" aria-label="شركة وصّل">
          <img class="brand-mark" src="assets/wassel-logo.png" alt="شعار وصّل" width="952" height="924">
          <span class="brand-text">
            <strong>وصّل</strong>
            <small>WASSEL · DELIVERY</small>
          </span>
        </div>
        <span class="location-chip"><i class="bi bi-geo-alt" aria-hidden="true"></i> صنعاء، اليمن</span>
      </div>

      <div class="hero">
        <span class="hero-eyebrow"><span class="live-dot" aria-hidden="true"></span> لوحة متابعة الطلبات</span>
        <h1>طلبات التوصيل</h1>
        <p>تابع جميع طلبات الزبائن في صنعاء من مكان واحد، واعرف حالة كل طلب بلمحة سريعة.</p>
      </div>
    </div>
  </header>

  <main class="main-content">
    <section class="container-xxl" aria-labelledby="ordersHeading">
      <div class="orders-panel" id="ordersPanel">
        <div class="panel-head">
          <div>
            <h2 id="ordersHeading">قائمة الطلبات</h2>
            <p>استعرض الطلبات وابحث عن طلبك ورتّبه حسب احتياجك.</p>
          </div>
          <div class="count-pill" id="ordersCount" aria-live="polite">—</div>
        </div>

        <div class="toolbar">
          <div class="search-wrap">
            <i class="bi bi-search search-icon" aria-hidden="true"></i>
            <label class="visually-hidden" for="searchInput">ابحث باسم الزبون</label>
            <input id="searchInput" class="search-input" type="search" placeholder="ابحث باسم الزبون..." autocomplete="off" spellcheck="false">
            <button class="clear-search" id="clearSearch" type="button" aria-label="مسح البحث" hidden>
              <i class="bi bi-x-lg" aria-hidden="true"></i>
            </button>
          </div>

          <div class="sort-wrap" role="group" aria-label="خيارات الترتيب">
            <div class="segmented" role="group" aria-label="ترتيب حسب">
              <button class="sort-option is-active" type="button" data-sort="date" aria-pressed="true">
                <i class="bi bi-calendar3" aria-hidden="true"></i> التاريخ
              </button>
              <button class="sort-option" type="button" data-sort="amount" aria-pressed="false">
                <i class="bi bi-cash-stack" aria-hidden="true"></i> المبلغ
              </button>
            </div>
            <label class="visually-hidden" for="sortDirection">اتجاه الترتيب</label>
            <select id="sortDirection" class="direction-select" aria-label="اتجاه الترتيب">
              <option value="desc">الأحدث أولاً</option>
              <option value="asc">الأقدم أولاً</option>
            </select>
          </div>
        </div>

        <div class="feedback" id="feedback" hidden aria-live="polite"></div>

        <div class="table-view" id="tableView" hidden>
          <div class="table-scroll">
            <table class="orders-table">
              <thead>
                <tr>
                  <th scope="col">رقم الطلب</th>
                  <th scope="col">اسم الزبون</th>
                  <th scope="col">المبلغ</th>
                  <th scope="col">التاريخ</th>
                  <th scope="col">الحالة</th>
                </tr>
              </thead>
              <tbody id="ordersTableBody"></tbody>
            </table>
          </div>
        </div>

        <div class="cards-view" id="cardsView" hidden></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container-xxl">
      <span>وصّل — طلبات التوصيل</span>
      <span>صنعاء، اليمن</span>
    </div>
  </footer>

  <script src="js/app.js" defer></script>
</body>
</html>
